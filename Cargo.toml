[workspace]
resolver = "3"
members = [
    "crates/shatterbox-core",
    "crates/shatterbox-platform",
    "crates/shatterbox-gpu",
    "crates/shatterbox-voxel",
    "crates/shatterbox-physics",
    "crates/shatterbox-destruction",
    "crates/shatterbox-render",
    "crates/shatterbox-game",
    "crates/shatterbox-tools",
]
default-members = ["crates/shatterbox-game"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
authors = ["Shatterbox contributors"]
repository = "https://example.invalid/shatterbox"

[workspace.dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"
glam = "0.32"
log = "0.4"
oxijolt = { version = "1.4.0", features = ["glam032"] }
png = "0.17"
pollster = "0.4"
ron = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "30.0.1"
winit = "0.30.13"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
